name: Build IPA

# Runs on every push to main, or manually via Actions tab.
# Produces HayaAI.ipa as a downloadable artifact.
# For a SIGNED ipa (needed for Sideloadly / AltStore):
#   Add these GitHub Secrets in Settings → Secrets → Actions:
#     APPLE_ID          – your Apple ID email
#     APPLE_ID_PASSWORD – an app-specific password from appleid.apple.com
#     TEAM_ID           – 10-char Team ID (free accounts: find in Xcode → Settings → Accounts)
#   The workflow will sign with your free developer certificate automatically.
#
# For an UNSIGNED ipa (works with TrollStore on supported iOS versions):
#   Just push — the unsigned build runs without any secrets.

on:
  push:
    branches: ["main", "cursor/haya-ai-ios-app-ea6d"]
  workflow_dispatch:

jobs:
  # ─── Unsigned build (always runs, no secrets needed) ─────────────────────
  build-unsigned:
    name: Build unsigned IPA
    runs-on: macos-15
    defaults:
      run:
        working-directory: HayaAI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve SPM packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project HayaAI.xcodeproj \
            -scheme HayaAI \
            -clonedSourcePackagesDirPath ../.spm-cache

      - name: Build (code-signing disabled)
        run: |
          xcodebuild archive \
            -project HayaAI.xcodeproj \
            -scheme HayaAI \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/HayaAI.xcarchive" \
            -clonedSourcePackagesDirPath ../.spm-cache \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | xcpretty || true

      - name: Package into IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/HayaAI.xcarchive/Products" -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive. Build may have failed."
            ls -R "$RUNNER_TEMP/HayaAI.xcarchive/" || true
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/HayaAI.app"
          cd "$RUNNER_TEMP"
          zip -r HayaAI-unsigned.ipa Payload
          echo "IPA size: $(du -sh HayaAI-unsigned.ipa | cut -f1)"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HayaAI-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/HayaAI-unsigned.ipa
          retention-days: 30

  # ─── Signed build (only runs when Apple ID secrets are configured) ────────
  build-signed:
    name: Build signed IPA (Sideloadly / AltStore ready)
    runs-on: macos-15
    # Skip this job if secrets are not set
    if: ${{ vars.ENABLE_SIGNED_BUILD == 'true' }}
    defaults:
      run:
        working-directory: HayaAI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Install Apple certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROFILE_BASE64" | base64 --decode -o "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | \
                 plutil -extract UUID raw -)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" \
             ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"

      - name: Resolve SPM packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project HayaAI.xcodeproj \
            -scheme HayaAI \
            -clonedSourcePackagesDirPath ../.spm-cache

      - name: Build and archive (signed)
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcodebuild archive \
            -project HayaAI.xcodeproj \
            -scheme HayaAI \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/HayaAI-signed.xcarchive" \
            -clonedSourcePackagesDirPath ../.spm-cache \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            | xcpretty

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HayaAI-signed.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: HayaAI-signed-${{ github.sha }}
          path: ${{ runner.temp }}/export/HayaAI.ipa
          retention-days: 30

  # ─── Create GitHub Release on tags ───────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-unsigned
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: HayaAI-unsigned-${{ github.sha }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: HayaAI-unsigned.ipa
          name: Haya AI ${{ github.ref_name }}
          body: |
            ## Haya AI ${{ github.ref_name }}

            ### Install options
            | Method | What you need | Steps |
            |--------|--------------|-------|
            | **Sideloadly** (Windows/Mac) | Windows PC + USB cable | See instructions below |
            | **TrollStore** | Supported iOS version (14.0–17.0) | Open IPA in TrollStore |
            | **SideStore** | iPhone + pairing file | Import IPA in SideStore |

            ### Sideloadly (Windows, no Mac needed)
            1. Download [Sideloadly](https://sideloadly.io) on your Windows PC
            2. Connect your iPhone
            3. Drag `HayaAI-unsigned.ipa` into Sideloadly
            4. Enter your Apple ID → click **Start**
            5. Trust the certificate on iPhone: Settings → General → VPN & Device Management
